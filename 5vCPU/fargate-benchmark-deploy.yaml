AWSTemplateFormatVersion: 2010-09-09
Description: Deploy Flask app to ECS Fargate with ALB

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Use default VPC
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Use subnets in us-east-1a and us-east-1b

Resources:

  FlaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP access to Flask app
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: 0.0.0.0/0

  FlaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/flask-app
      RetentionInDays: 7

  FlaskALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: flask-app-alb-v2
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref FlaskSecurityGroup
      Type: application

  FlaskALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: flask-app-tg-v2
      Port: 5000
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /health
      Matcher:
        HttpCode: 200
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  FlaskALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref FlaskALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FlaskALBTargetGroup

  FlaskCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: flask-app-cluster-v2

  FlaskTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: flask-app-task-v2
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: arn:aws:iam::634914382615:role/flask-fargate-execution
      ContainerDefinitions:
        - Name: flask-container
          Image: 634914382615.dkr.ecr.us-east-1.amazonaws.com/workload-fargate-repo:latest
          PortMappings:
            - ContainerPort: 5000
              Protocol: tcp
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/flask-app
              awslogs-region: us-east-1
              awslogs-stream-prefix: ecs

  FlaskService:
    Type: AWS::ECS::Service
    DependsOn: FlaskALBListener
    Properties:
      ServiceName: flask-app-service-v2
      Cluster: !Ref FlaskCluster
      TaskDefinition: !Ref FlaskTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref FlaskSecurityGroup
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - ContainerName: flask-container
          ContainerPort: 5000
          TargetGroupArn: !Ref FlaskALBTargetGroup
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

Outputs:
  LoadBalancerDNS:
    Description: DNS name of the load balancer
    Value: !GetAtt FlaskALB.DNSName
